kind = "mobile"
previewPath = "/"
title = "ICU Drip Trainer"
version = "1.0.0"
id = "artifacts/icu-drips"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
ensurePreviewReachable = "/status"
name = "expo"
paths = [ "/" ]
localPort = 22526

[services.development]
run = "pnpm --filter @workspace/icu-drips run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/icu-drips", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/icu-drips", "run", "serve" ]

[services.env]
PORT = "22526"
BASE_PATH = "/"
